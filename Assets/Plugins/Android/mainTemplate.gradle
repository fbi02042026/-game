apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Assets/DirichletMediation/Editor/DirichletMediationDependencies.xml:45
    implementation 'androidx.core:core:1.9.0' // Assets/DirichletMediation/Editor/DirichletMediationDependencies.xml:27
    implementation 'androidx.fragment:fragment:1.5.5' // Assets/DirichletMediation/Editor/DirichletMediationDependencies.xml:33
    implementation 'androidx.recyclerview:recyclerview:1.2.1' // Assets/DirichletMediation/Editor/DirichletMediationDependencies.xml:21
    implementation 'com.squareup.okhttp3:okhttp:3.12.1' // Assets/DirichletMediation/Editor/DirichletMediationDependencies.xml:39
    implementation 'com.taptap.sdk:tap-core:4.10.9' // Packages/com.taptap.sdk.core/Mobile/Editor/NativeDependencies.xml:7
    implementation 'com.taptap.sdk:tap-login:4.10.9' // Packages/com.taptap.sdk.login/Mobile/Editor/NativeDependencies.xml:7
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packagingOptions {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/armeabi-v7a/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdk **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDKVERSION**
        targetSdk **TARGETSDKVERSION**
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-tuanjie.txt'**USER_PROGUARD**
    }

    lint {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + tuanjieStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
